name: TP5 CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build_and_pack:
    name: Build and Pack
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- BACKEND ----------
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore backend
        run: dotnet restore backend/DevTaskHub.sln

      - name: Build backend (ignore warnings)
        run: dotnet build backend/DevTaskHub.sln -c Release --no-restore -p:TreatWarningsAsErrors=false

      - name: Publish API
        run: dotnet publish backend/DevTaskHub.Api/DevTaskHub.Api.csproj -c Release --no-build -p:TreatWarningsAsErrors=false -o backend/out

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-artifact
          path: backend/out

      # ---------- FRONTEND ----------
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/devtaskhub-frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci --legacy-peer-deps
        working-directory: frontend/devtaskhub-frontend

      - name: Build frontend QA
        env:
          VITE_API_BASE_URL: https://placeholder-qa.local
        run: |
          npm run build
          rm -rf ../dist-qa
          mkdir -p ../dist-qa
          cp -R dist/. ../dist-qa
        working-directory: frontend/devtaskhub-frontend

      - name: Build frontend PROD
        env:
          VITE_API_BASE_URL: https://placeholder-prod.local
        run: |
          rm -rf dist
          npm run build
          rm -rf ../dist-prod
          mkdir -p ../dist-prod
          cp -R dist/. ../dist-prod
        working-directory: frontend/devtaskhub-frontend

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-artifacts
          path: |
            frontend/dist-qa
            frontend/dist-prod

  deploy_backend_qa:
    name: Deploy Backend QA
    runs-on: ubuntu-22.04
    needs: build_and_pack
    if: github.ref == 'refs/heads/main'
    environment: QA

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-artifact
          path: backend

      - name: Simulated deploy backend QA
        run: |
          echo "Deploy Backend QA"
          echo "ENVIRONMENT=${{ vars.ENVIRONMENT }}"
          echo "API_BASE_URL=${{ vars.API_BASE_URL }}"
          ls -R backend | head -n 40

      - name: Simulated health check QA
        run: |
          echo "curl ${{ vars.API_BASE_URL }}/api/health"

  deploy_frontend_qa:
    name: Deploy Frontend QA
    runs-on: ubuntu-22.04
    needs: deploy_backend_qa
    if: github.ref == 'refs/heads/main'
    environment: QA

    steps:
      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-artifacts
          path: frontend

      - name: Simulated deploy frontend QA
        run: |
          echo "Deploy Frontend QA"
          ls -R frontend/dist-qa | head -n 40

  deploy_backend_prod:
    name: Deploy Backend PROD
    runs-on: ubuntu-22.04
    needs: deploy_frontend_qa
    if: github.ref == 'refs/heads/main'
    environment: PROD

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-artifact
          path: backend

      - name: Simulated deploy backend PROD
        run: |
          echo "Deploy Backend PROD"
          echo "ENVIRONMENT=${{ vars.ENVIRONMENT }}"
          ls -R backend | head -n 40

      - name: Simulated health check PROD
        run: |
          echo "curl ${{ vars.API_BASE_URL }}/api/health"

  deploy_frontend_prod:
    name: Deploy Frontend PROD
    runs-on: ubuntu-22.04
    needs: deploy_backend_prod
    if: github.ref == 'refs/heads/main'
    environment: PROD

    steps:
      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-artifacts
          path: frontend

      - name: Simulated deploy frontend PROD
        run: |
          echo "Deploy Frontend PROD"
          ls -R frontend/dist-prod | head -n 40
