trigger:
- main

pool:
  name: Default
  demands:
  - Agent.OS -equals Darwin

variables:
  buildConfiguration: 'Release'
  dotNetVersion: '8.0.x'

stages:
- stage: Build
  displayName: 'Build Backend + Frontend'
  jobs:
  - job: BuildJob
    displayName: 'Build Everything'
    steps:

    # ===========================
    # BACKEND (.NET 8)
    # ===========================

    - task: UseDotNet@2
      displayName: 'Use .NET SDK 8'
      inputs:
        packageType: 'sdk'
        version: '$(dotNetVersion)'

    - task: DotNetCoreCLI@2
      displayName: 'Restore Backend'
      inputs:
        command: 'restore'
        projects: '**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Build Backend'
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Test Backend with Coverage'
      inputs:
        command: 'custom'
        custom: 'test'
        arguments: 'backend/DevTaskHub.sln /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:CoverletOutput=$(Agent.TempDirectory)/coverage.cobertura.xml --configuration $(buildConfiguration) --no-build --logger trx --results-directory $(Agent.TempDirectory)/TestResults'
      continueOnError: false

    - task: PublishCodeCoverageResults@2
      displayName: 'Publish Backend Coverage (Cobertura)'
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: '$(Agent.TempDirectory)/coverage.cobertura.xml'
        reportDirectory: '$(Agent.TempDirectory)'

    - task: PublishTestResults@2
      displayName: 'Publish Backend Test Results'
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '**/TestResults/*.trx'
        searchFolder: '$(Agent.TempDirectory)/TestResults'
        mergeTestResults: true
        testRunTitle: 'Backend Tests'

    - task: DotNetCoreCLI@2
      displayName: 'Publish Backend Web API'
      inputs:
        command: 'publish'
        publishWebProjects: true
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/backend --no-build'
        zipAfterPublish: true

    # ===========================
    # FRONTEND (React + Vite)
    # ===========================

    - task: NodeTool@0
      displayName: 'Install Node.js 18'
      inputs:
        versionSpec: '18.x'

    - script: |
        set -e
        cd frontend/devtaskhub-frontend
        npm install
      displayName: 'Install Frontend Dependencies'
    - script: |
        set -e
        cd frontend/devtaskhub-frontend
        npm run test:run
      displayName: 'Run Frontend Tests'
      env:
        CI: 'true'

    - script: |
        set -e
        cd frontend/devtaskhub-frontend
        rm -rf dist
        npm run build
        rm -rf $(Build.ArtifactStagingDirectory)/frontend/dist-qa
        mkdir -p $(Build.ArtifactStagingDirectory)/frontend/dist-qa
        cp -R dist/. $(Build.ArtifactStagingDirectory)/frontend/dist-qa
      displayName: 'Build Frontend (QA)'
      env:
        VITE_API_BASE_URL: "https://devtaskhub-backend-qa-hmfzd9aqh3dcc7b5.centralus-01.azurewebsites.net"

    - script: |
        set -e
        cd frontend/devtaskhub-frontend
        rm -rf dist
        npm run build
        rm -rf $(Build.ArtifactStagingDirectory)/frontend/dist-prod
        mkdir -p $(Build.ArtifactStagingDirectory)/frontend/dist-prod
        cp -R dist/. $(Build.ArtifactStagingDirectory)/frontend/dist-prod
      displayName: 'Build Frontend (Prod)'
      env:
        VITE_API_BASE_URL: "https://devtaskhub-backend-prod-cvbdd2brc6fchbbk.centralus-01.azurewebsites.net"

    - task: ArchiveFiles@2
      displayName: 'Zip Frontend QA'
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/frontend/dist-qa'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/frontend/frontend-qa.zip'
        replaceExistingArchive: true

    - task: ArchiveFiles@2
      displayName: 'Zip Frontend Prod'
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/frontend/dist-prod'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/frontend/frontend-prod.zip'
        replaceExistingArchive: true

    # ===========================
    # PUBLICAR ARTEFACTOS
    # ===========================

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Backend Artifact'
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)/backend'
        artifactName: 'drop'
        publishLocation: 'Container'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Frontend Artifact'
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)/frontend'
        artifactName: 'frontend'
        publishLocation: 'Container'
